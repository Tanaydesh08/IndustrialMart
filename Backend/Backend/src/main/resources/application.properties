spring.application.name=Backend
server.port=${PORT:8080}

# PostgreSQL configuration
spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT:5432}/${PGDATABASE}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JPA configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false

# Prototype payment configuration
industrial-mart.payment.credit-pack-paise=${CREDIT_PACK_PAISE:9900}
industrial-mart.payment.credit-pack-credits=${CREDIT_PACK_CREDITS:10}
industrial-mart.payment.listing-fee-paise=${LISTING_FEE_PAISE:19900}
industrial-mart.payment.listing-unlock-price-paise=${LISTING_UNLOCK_PRICE_PAISE:9900}
# New uploads use private S3-compatible object storage. Keep this local path only for legacy image URLs.
industrial-mart.storage.s3.bucket=${S3_BUCKET:}
industrial-mart.storage.s3.region=${S3_REGION:us-east-1}
industrial-mart.storage.s3.endpoint=${S3_ENDPOINT:}
industrial-mart.storage.s3.path-style=${S3_PATH_STYLE:false}
industrial-mart.storage.listing-images=${LISTING_IMAGE_DIRECTORY:./uploads/listings}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=42MB
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:https://industrialmart-production.up.railway.app}

# JWT configuration
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=3600000
