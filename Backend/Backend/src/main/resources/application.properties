spring.application.name=Backend
server.port=${PORT:8080}

# PostgreSQL configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/industrial_mart}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:tanay}

# Development configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#prototype Payment Simulation - no Razorpay calls
industrial-mart.payment.credit-pack-paise=${CREDIT_PACK_PAISE:9900}
industrial-mart.payment.credit-pack-credits=${CREDIT_PACK_CREDITS:10}
industrial-mart.payment.listing-fee-paise=${LISTING_FEE_PAISE:19900}