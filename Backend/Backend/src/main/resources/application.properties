spring.application.name=Backend
server.port=${PORT:8080}

# PostgreSQL configuration
spring.datasource.url=jdbc:${DATABASE_URL}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JPA configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false

# Prototype payment configuration
industrial-mart.payment.credit-pack-paise=${CREDIT_PACK_PAISE:9900}
industrial-mart.payment.credit-pack-credits=${CREDIT_PACK_CREDITS:10}
industrial-mart.payment.listing-fee-paise=${LISTING_FEE_PAISE:19900}

# JWT configuration
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=3600000
